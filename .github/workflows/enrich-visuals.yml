name: Enrich paper visuals

on:
  workflow_dispatch:
  push:
    paths:
      - "src/arxiv_wiki/figures.py"
      - "scripts/enrich_paper_visuals.py"
      - "pyproject.toml"
      - ".github/workflows/enrich-visuals.yml"

permissions:
  contents: write

concurrency:
  group: enrich-paper-visuals
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Extract figures and tables
        run: python scripts/enrich_paper_visuals.py

      - name: Commit enriched pages
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "docs: add key visuals from paper PDFs"
          file_pattern: "docs/papers/*.md docs/assets/papers/**"
