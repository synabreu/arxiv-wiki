name: Daily arXiv AI Wiki

on:
  schedule:
    - cron: "10 23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate Wiki
        timeout-minutes: 30
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          python -m arxiv_wiki.cli \
            --limit 5 \
            --max-results 50

      - name: Commit Markdown
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update daily arXiv wiki"
