name: Daily arXiv AI Wiki

on:
  schedule:
    # 08:10 KST = 23:10 UTC (previous day)
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-wiki
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate Top 10 Markdown
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: arxiv-wiki --limit 10 --lookback-hours 96
      - name: Commit generated wiki
        run: |
          git config user.name "arxiv-wiki-bot"
          git config user.email "arxiv-wiki-bot@users.noreply.github.com"
          git add docs data/last_run.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: add daily arXiv AI Top 10"
          git push
